<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>総論Ⅱ 〇✕クイズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    /* モード切替ボタンのスタイル */
    .header-buttons {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
    }

    .mode-toggle-btn {
      padding: 8px 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mode-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .mode-toggle-btn.active {
      background: rgba(255, 255, 255, 0.3);
      border-color: white;
    }

    .mode-toggle-btn .badge {
      background: #ff5722;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    .review-mode-indicator {
      background: #ff5722;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      margin-top: 10px;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .filters {
      padding: 20px;
      background: #f7f7f7;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }

    .filter-btn:hover {
      background: #667eea;
      color: white;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
    }

    .quiz-container {
      padding: 40px;
      min-height: 400px;
    }

    .quiz-content {
      text-align: center;
    }

    .question-number {
      color: #667eea;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .question-number.review-mode {
      color: #ff5722;
    }

    .category-badge {
      display: inline-block;
      padding: 5px 15px;
      background: #e9ecef;
      border-radius: 15px;
      font-size: 12px;
      margin-bottom: 20px;
      color: #495057;
    }

    .category-badge.review-mode {
      background: #ffebee;
      color: #c62828;
    }

    .question {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 40px;
      color: #333;
      min-height: 60px;
    }

    .answer-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .answer-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ddd;
      background: white;
      font-size: 48px;
      cursor: pointer;
      transition: all 0.3s;
      color: #333;
    }

    .answer-btn:hover:not(:disabled) {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .answer-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .answer-btn.correct {
      background: #28a745;
      color: white;
      border-color: #28a745;
    }

    .answer-btn.incorrect {
      background: #dc3545;
      color: white;
      border-color: #dc3545;
    }

    .result-message {
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: bold;
      animation: fadeIn 0.5s;
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
    }

    .result-message.incorrect {
      background: #f8d7da;
      color: #721c24;
    }

    .explanation {
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
      text-align: left;
      animation: fadeIn 0.5s;
    }

    .next-btn, .start-btn, .restart-btn, .review-btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      margin: 5px;
    }

    .review-btn {
      background: linear-gradient(135deg, #ff7043 0%, #ff5722 100%);
    }

    .review-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .clear-btn {
      background: linear-gradient(135deg, #9e9e9e 0%, #616161 100%);
    }

    .next-btn:hover, .start-btn:hover, .restart-btn:hover, 
    .review-btn:hover:not(:disabled), .clear-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      width: 0%;
    }

    .progress-fill.review-mode {
      background: linear-gradient(135deg, #ff7043 0%, #ff5722 100%);
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 40px;
    }

    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    .start-screen, .result-screen {
      text-align: center;
      padding: 20px;
    }

    .result-chart {
      margin: 30px 0;
    }

    .score-display {
      font-size: 48px;
      color: #667eea;
      margin: 20px 0;
    }

    .review-section {
      background: #fff3e0;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      border: 2px solid #ff9800;
    }

    .review-section h3 {
      color: #f57c00;
      margin-bottom: 10px;
    }

    .incorrect-count {
      font-size: 24px;
      font-weight: bold;
      color: #ff5722;
    }

    .mode-info {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      border-left: 4px solid #667eea;
    }

    .mode-info.review-mode {
      border-left-color: #ff5722;
      background: #fff3e0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .answer-btn {
        width: 100px;
        height: 100px;
        font-size: 36px;
      }
      
      .question {
        font-size: 18px;
      }

      .header-buttons {
        position: static;
        margin-top: 15px;
        justify-content: center;
      }

      .mode-toggle-btn {
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>医療系〇✕クイズ</h1>
      <!-- 常設のモード切替ボタン -->
      <div class="header-buttons" id="headerButtons" style="display: none;">
        <button class="mode-toggle-btn" id="normalModeBtn" onclick="switchToNormalMode()">
          📚 通常モード
        </button>
      </div>
      <div class="review-mode-indicator" id="reviewModeIndicator" style="display: none;">
        復習モード実行中
      </div>
      <div class="stats" id="stats" style="display: none;">
        <div class="stat-item">
          <div class="stat-value" id="correctCount">0</div>
          <div class="stat-label">正解</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="incorrectCount">0</div>
          <div class="stat-label">不正解</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="remainingCount">0</div>
          <div class="stat-label">残り</div>
        </div>
      </div>
    </div>

    <div class="filters" id="filters" style="display: none;">
      <button class="filter-btn active" onclick="filterByCategory('all')">すべて</button>
    </div>

    <div class="quiz-container">
      <!-- スタート画面 -->
      <div class="start-screen" id="startScreen">
        <h2>クイズを始めましょう！</h2>
        <div class="loading" id="loading">
          <div class="loading-spinner"></div>
          <p>データを読み込み中...</p>
        </div>
        <div id="startContent" style="display: none;">
          <p style="margin-top: 20px; color: #666;">
            <span id="loadedCount"></span>問の問題を読み込みました。<br>
            カテゴリを選択して学習することもできます。
          </p>
          <button class="start-btn" onclick="startQuiz()">クイズを開始</button>
          
          <div class="review-section" id="reviewSection" style="display: none;">
            <h3>📝 復習モード</h3>
            <p>間違えた問題が <span class="incorrect-count" id="incorrectQuestionCount">0</span> 問あります</p>
            <button class="review-btn" id="reviewBtn" onclick="startReviewMode()">復習モードで挑戦</button>
            <button class="clear-btn" onclick="clearIncorrectQuestions()">履歴をクリア</button>
          </div>
        </div>
      </div>

      <!-- クイズ画面 -->
      <div class="quiz-content" id="quizContent" style="display: none;">
        <div class="mode-info" id="modeInfo" style="display: none;">
          <strong id="modeInfoText">モード情報</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="question-number" id="questionNumber"></div>
        <div class="category-badge" id="categoryBadge"></div>
        <div class="question" id="question"></div>
        <div class="answer-buttons">
          <button class="answer-btn" id="btnMaru" onclick="checkAnswer('○')">○</button>
          <button class="answer-btn" id="btnBatsu" onclick="checkAnswer('×')">×</button>
        </div>
        <div id="resultArea"></div>
      </div>

      <!-- 結果画面 -->
      <div class="result-screen" id="resultScreen" style="display: none;">
        <h2 id="resultTitle">クイズ終了！</h2>
        <div class="result-chart">
          <div class="score-display">
            <span id="finalScore">0</span>%
          </div>
          <p style="font-size: 20px; color: #666;">
            <span id="finalCorrect">0</span>問正解 / <span id="totalQuestions">0</span>問中
          </p>
          <div id="reviewMessage" style="display: none; margin-top: 20px; padding: 20px; background: #f3e5f5; border-radius: 10px;">
            <p id="reviewMessageText" style="color: #7b1fa2; font-weight: bold;"></p>
          </div>
        </div>
        <button class="restart-btn" onclick="restartQuiz()">もう一度挑戦</button>
        <button class="review-btn" id="reviewBtnResult" onclick="startReviewMode()" style="display: none;">復習モードへ</button>
      </div>
    </div>
  </div>

    <script>
    // ===== 設定 =====
    // 同じ github.io ドメイン上の他アプリと保存データが混ざらないよう、キーに固有の接頭辞を付ける
    const STORAGE_KEY = 'soron2-quiz:incorrect';

    // ===== 状態 =====
    let quizData = [];
    let filteredQuizData = [];
    let currentQuestionIndex = 0;
    let correctAnswers = 0;
    let incorrectAnswers = 0;
    let currentCategory = 'all';
    let answered = false;
    let incorrectKeys = [];   // 間違えた問題の「問題文」だけを保存(最新の内容は quizData から引く)
    let isReviewMode = false;

    const $ = id => document.getElementById(id);

    window.addEventListener('DOMContentLoaded', () => {
      loadIncorrectQuestions();
      loadQuizData();
    });

    // ===== ユーティリティ =====
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function normalizeAnswer(answer) {
      const s = String(answer || '');
      if (/[〇○◯⭕]/.test(s)) return '○';
      if (/[✕×✖╳❌]/.test(s)) return '×';
      return s;
    }

    // 復習対象の問題(現在の問題データに存在するものだけ)
    function getIncorrectQuestions() {
      const byText = new Map(quizData.map(q => [q.question, q]));
      return incorrectKeys.map(k => byText.get(k)).filter(Boolean);
    }

    // ===== データ読み込み =====
    async function loadQuizData() {
      try {
        const res = await fetch('questions.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        quizData = data.map(q => ({ ...q, answer: normalizeAnswer(q.answer) }));
        filteredQuizData = [...quizData];

        // 問題データから消えた問題は復習リストからも外す
        const valid = new Set(quizData.map(q => q.question));
        const before = incorrectKeys.length;
        incorrectKeys = incorrectKeys.filter(k => valid.has(k));
        if (incorrectKeys.length !== before) saveIncorrectQuestions();

        buildCategoryButtons();
        $('loadedCount').textContent = quizData.length;
        $('loading').style.display = 'none';
        $('startContent').style.display = 'block';
        updateReviewSection();
        updateHeaderButtons();
      } catch (error) {
        console.error('Error loading data:', error);
        $('loading').innerHTML =
          '<p style="color: red;">問題データの読み込みに失敗しました。<br>ページを再読み込みしてください。</p>';
      }
    }

    function buildCategoryButtons() {
      const categories = [...new Set(quizData.map(q => q.category))];
      const filtersDiv = $('filters');
      categories.forEach(category => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = category;
        btn.dataset.category = category;
        btn.onclick = () => filterByCategory(category);
        filtersDiv.appendChild(btn);
      });
      filtersDiv.querySelector('.filter-btn').dataset.category = 'all';
    }

    // ===== 間違えた問題の保存(この端末のブラウザ内) =====
    function loadIncorrectQuestions() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        incorrectKeys = Array.isArray(stored) ? stored.filter(s => typeof s === 'string') : [];
      } catch (e) {
        incorrectKeys = [];
      }
    }

    function saveIncorrectQuestions() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(incorrectKeys));
      } catch (e) {
        // プライベートブラウズ等で保存できない場合も動作は続ける
      }
      updateReviewSection();
      updateHeaderButtons();
    }

    function updateHeaderButtons() {
      if ($('quizContent').style.display !== 'none' ||
          $('resultScreen').style.display !== 'none') {
        $('headerButtons').style.display = 'flex';
      }
    }

    function updateReviewSection() {
      const count = incorrectKeys.length;
      $('reviewSection').style.display = count > 0 ? 'block' : 'none';
      $('incorrectQuestionCount').textContent = count;
      $('reviewBtn').disabled = count === 0;
    }

    // ===== カテゴリ =====
    function filterByCategory(category) {
      if (isReviewMode) {
        alert('復習モード中はカテゴリを変更できません。通常モードに戻してください。');
        return;
      }
      currentCategory = category;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
      });

      filteredQuizData = shuffle(category === 'all'
        ? [...quizData]
        : quizData.filter(item => item.category === category));

      currentQuestionIndex = 0;
      correctAnswers = 0;
      incorrectAnswers = 0;

      if ($('quizContent').style.display === 'block') {
        displayQuestion();
        updateStats();
      }
    }

    // ===== モード切替 =====
    function switchToNormalMode() {
      if (!isReviewMode) return;
      if (!confirm('通常モードに切り替えますか？現在の進捗は失われます。')) return;
      isReviewMode = false;
      updateModeUI();
      filterByCategory(currentCategory);
      displayQuestion();
      updateStats();
    }

    function updateModeUI() {
      const modeInfo = $('modeInfo');
      $('normalModeBtn').classList.toggle('active', !isReviewMode);
      $('reviewModeIndicator').style.display = isReviewMode ? 'inline-block' : 'none';
      modeInfo.style.display = 'block';
      modeInfo.className = isReviewMode ? 'mode-info review-mode' : 'mode-info';
      $('modeInfoText').textContent = isReviewMode
        ? '📝 復習モード: 間違えた問題のみ出題されます'
        : '📚 通常モード: 選択したカテゴリから出題されます';
      $('filters').style.display = isReviewMode ? 'none' : 'flex';
    }

    function showQuizScreen() {
      $('startScreen').style.display = 'none';
      $('resultScreen').style.display = 'none';
      $('quizContent').style.display = 'block';
      $('stats').style.display = 'flex';
      $('headerButtons').style.display = 'flex';
    }

    function startQuiz() {
      isReviewMode = false;
      showQuizScreen();
      updateModeUI();
      filterByCategory(currentCategory);  // シャッフルとリセットもここで行う
      displayQuestion();
      updateStats();
    }

    function startReviewMode() {
      const questions = getIncorrectQuestions();
      if (questions.length === 0) {
        alert('復習する問題がありません。');
        return;
      }
      isReviewMode = true;
      showQuizScreen();
      updateModeUI();
      filteredQuizData = shuffle(questions);
      currentQuestionIndex = 0;
      correctAnswers = 0;
      incorrectAnswers = 0;
      displayQuestion();
      updateStats();
    }

    // ===== 出題 =====
    function displayQuestion() {
      if (currentQuestionIndex >= filteredQuizData.length) {
        showResults();
        return;
      }
      answered = false;
      const question = filteredQuizData[currentQuestionIndex];
      const total = filteredQuizData.length;

      const numberElement = $('questionNumber');
      numberElement.textContent = (isReviewMode ? '復習問題 ' : '問題 ') +
        (currentQuestionIndex + 1) + ' / ' + total;
      numberElement.className = isReviewMode ? 'question-number review-mode' : 'question-number';

      const badge = $('categoryBadge');
      badge.textContent = question.category;
      badge.className = isReviewMode ? 'category-badge review-mode' : 'category-badge';

      $('question').textContent = question.question;
      $('resultArea').innerHTML = '';

      ['btnMaru', 'btnBatsu'].forEach(id => {
        $(id).classList.remove('correct', 'incorrect');
        $(id).disabled = false;
      });

      const bar = $('progressFill');
      bar.style.width = (currentQuestionIndex / total) * 100 + '%';
      bar.className = isReviewMode ? 'progress-fill review-mode' : 'progress-fill';
    }

    function checkAnswer(userAnswer) {
      if (answered) return;
      answered = true;

      const question = filteredQuizData[currentQuestionIndex];
      const user = normalizeAnswer(userAnswer);
      const correct = question.answer;
      const isCorrect = user === correct;

      const btnMaru = $('btnMaru');
      const btnBatsu = $('btnBatsu');
      btnMaru.disabled = true;
      btnBatsu.disabled = true;
      const chosen = user === '○' ? btnMaru : btnBatsu;
      const other = user === '○' ? btnBatsu : btnMaru;
      chosen.classList.add(isCorrect ? 'correct' : 'incorrect');
      if (!isCorrect) other.classList.add('correct');

      const area = $('resultArea');
      area.innerHTML = '';

      const msg = document.createElement('div');
      if (isCorrect) {
        correctAnswers++;
        msg.className = 'result-message correct';
        msg.textContent = '正解！';
        if (isReviewMode) {
          incorrectKeys = incorrectKeys.filter(k => k !== question.question);
          saveIncorrectQuestions();
        }
      } else {
        incorrectAnswers++;
        msg.className = 'result-message incorrect';
        msg.textContent = '不正解... 正解は「' + correct + '」';
        if (!isReviewMode && !incorrectKeys.includes(question.question)) {
          incorrectKeys.push(question.question);
          saveIncorrectQuestions();
        }
      }
      area.appendChild(msg);

      if (question.explanation) {
        const exp = document.createElement('div');
        exp.className = 'explanation';
        const label = document.createElement('strong');
        label.textContent = '解説: ';
        exp.appendChild(label);
        exp.appendChild(document.createTextNode(question.explanation));
        area.appendChild(exp);
      }

      const next = document.createElement('button');
      next.className = 'next-btn';
      next.textContent = currentQuestionIndex + 1 < filteredQuizData.length ? '次の問題' : '結果を見る';
      next.onclick = nextQuestion;
      area.appendChild(next);

      updateStats();
    }

    function nextQuestion() {
      currentQuestionIndex++;
      updateStats();
      displayQuestion();
    }

    function updateStats() {
      $('correctCount').textContent = correctAnswers;
      $('incorrectCount').textContent = incorrectAnswers;
      $('remainingCount').textContent =
        Math.max(0, filteredQuizData.length - correctAnswers - incorrectAnswers);
    }

    // ===== 結果 =====
    function showResults() {
      $('quizContent').style.display = 'none';
      $('resultScreen').style.display = 'block';
      $('stats').style.display = 'none';
      $('filters').style.display = 'none';
      $('modeInfo').style.display = 'none';
      $('reviewModeIndicator').style.display = 'none';

      const total = filteredQuizData.length;
      $('finalScore').textContent = total ? Math.round((correctAnswers / total) * 100) : 0;
      $('finalCorrect').textContent = correctAnswers;
      $('totalQuestions').textContent = total;

      const remaining = incorrectKeys.length;
      const reviewMessage = $('reviewMessage');
      const reviewMessageText = $('reviewMessageText');

      if (isReviewMode) {
        $('resultTitle').textContent = '復習モード終了！';
        reviewMessage.style.display = 'block';
        if (remaining === 0) {
          reviewMessageText.textContent = '🎉 パーフェクト！すべての問題をマスターしました！';
          reviewMessageText.style.color = '#28a745';
        } else {
          reviewMessageText.textContent = 'まだ ' + remaining + ' 問の間違えた問題が残っています';
          reviewMessageText.style.color = '#7b1fa2';
        }
      } else {
        $('resultTitle').textContent = 'クイズ終了！';
        reviewMessage.style.display = 'none';
      }
      $('reviewBtnResult').style.display = remaining > 0 ? 'inline-block' : 'none';
      updateHeaderButtons();
    }

    function clearIncorrectQuestions() {
      if (confirm('間違えた問題の履歴をすべてクリアしますか？')) {
        incorrectKeys = [];
        saveIncorrectQuestions();
        alert('履歴をクリアしました。');
      }
    }

    function restartQuiz() {
      $('resultScreen').style.display = 'none';
      $('startScreen').style.display = 'block';
      $('startContent').style.display = 'block';
      $('headerButtons').style.display = 'none';
      isReviewMode = false;
      updateReviewSection();
      filterByCategory('all');
    }
  </script>
</body>
</html>
